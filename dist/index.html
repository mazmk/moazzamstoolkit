    <title>ScreenNest</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong theme.
      // Mirrors useApplyTheme in src/shared/theme/theme.ts.
      ;(function () {
        var theme = 'system'
        try {
          theme = JSON.parse(localStorage.getItem('screennest:theme')).state.theme || 'system'
        } catch (e) {}
        var dark =
          theme === 'dark' ||
          (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
